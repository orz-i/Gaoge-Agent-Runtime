name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the existing required-check name; fail closed for every dependency.
  quality:
    name: Unit, race, lint, and release consumers
    if: ${{ always() }}
    needs: [quality-main, race]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all quality checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality-main.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: test "$QUALITY_RESULT" = success && test "$RACE_RESULT" = success

  quality-main:
    name: Unit, lint, and release consumers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate pull request Markdown description
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-body-format.mjs

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Go linter
        id: linter-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.14.0-${{ hashFiles('go.work') }}

      - name: Install Go linter
        if: steps.linter-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.local/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Add Go linter to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run release-quality gate
        run: make check-no-race

  race:
    name: Go race detector
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Run all Go race tests
        run: make go-race

  release-commands-windows:
    name: Windows release command safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate shell-free release commands
        run: node --test scripts/release-command.test.mjs

  coverage:
    name: Coverage gates
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce coverage floors
        run: make coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/go
            ts/agent-runtime-client/coverage
          if-no-files-found: error

  security:
    name: Vulnerability audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Scan Go and Node dependencies
        run: make security

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://agent_runtime:agent_runtime@127.0.0.1:5432/agent_runtime?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Run real-engine suites
        run: make integration-test

  observability:
    name: OpenTelemetry Collector E2E
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Run Collector trace and metric gate
        run: make integration-otel
