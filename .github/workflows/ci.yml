name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CI_TIMING_DIRECTORY: ${{ github.workspace }}/artifacts/ci-timings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the existing required-check name; fail closed for every dependency.
  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Full CI (milestone, non-merge)' || 'Unit, race, lint, and release consumers' }}
    if: ${{ always() }}
    needs: [quality-main, race, release-commands-windows, sqlite-windows, coverage-go, coverage, security, integration-shards, integration, observability]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require actually executed Full CI (Draft is deliberately blocked)
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_PR_DRAFT: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) || 'null' }}
          CI_GATE: ${{ github.event_name == 'workflow_dispatch' && 'milestone' || 'full' }}
        run: node scripts/check-ci-results.mjs

  impact:
    name: CI impact analysis (shadow)
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    # Policy regression tests remain mandatory in metadata. This runtime report
    # is advisory: checkout/report/storage outages must not block valid code.
    continue-on-error: true
    permissions:
      contents: read
    env:
      CI_IMPACT_DIRECTORY: ${{ github.workspace }}/artifacts/ci-impact
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Report advisory scope without skipping any checks
        run: node scripts/ci-impact.mjs
      - name: Upload shadow impact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow-${{ github.run_attempt }}
          path: ${{ env.CI_IMPACT_DIRECTORY }}
          retention-days: 7
          if-no-files-found: warn

  quality-main:
    name: Static, smoke, and release consumers
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate pull request Markdown description
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-body-format.mjs

      - uses: ./.github/actions/setup-sqlite

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Go linter
        id: linter-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-golangci-lint-v2.14.0-${{ hashFiles('go.work') }}

      - name: Install Go linter
        if: steps.linter-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.local/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Add Go linter to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run static checks before behavioral tests
        run: make ci-static

      - name: Run smoke and release-consumer checks
        run: make ci-consumers

      - name: Run TypeScript tests in Draft (Full uses coverage)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: make ts-test

      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings

  fast-native:
    name: Draft contracts (${{ matrix.profile }})
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [core, native]
    services:
      postgres:
        image: ${{ matrix.profile == 'native' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: ${{ matrix.profile == 'native' && 'postgres://agent_runtime:agent_runtime@127.0.0.1:5432/agent_runtime?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: fast-${{ matrix.profile }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-sqlite
      - name: Run the original Draft contract profile
        env:
          CI_FAST_PROFILE: ${{ matrix.profile }}
        run: node scripts/ci-timings.mjs --run "draft-$CI_FAST_PROFILE" -- node scripts/ci-fast.mjs "--profile=$CI_FAST_PROFILE"
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings
        with:
          suffix: -${{ matrix.profile }}

  fast:
    name: Fast CI (Draft task feedback)
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    needs: [quality-main, security, fast-native]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require all actually executed Draft checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_PR_DRAFT: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) || 'null' }}
          CI_GATE: fast
        run: node scripts/check-ci-results.mjs

  race:
    name: Go race detector (${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core, sqlite, adapters]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: race-${{ matrix.shard }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-sqlite
      - name: Run complete Go race shard
        run: node scripts/ci-timings.mjs --run go-race-${{ matrix.shard }} -- node scripts/go-workspace.mjs race --shard=${{ matrix.shard }}
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings
        with:
          suffix: -${{ matrix.shard }}

  release-commands-windows:
    name: Windows release command safety
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate shell-free release commands
        run: node scripts/ci-timings.mjs --run windows-release-commands -- node --test scripts/release-command.test.mjs
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings

  sqlite-windows:
    name: Windows SQLite profiles
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Run native SQLite Store and profile tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./go/agent-runtime-sqlite/... ./go/agent-runtime-harness-sqlite/...

  coverage-go:
    name: Go unit and coverage (${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core, sqlite, adapters]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: coverage-${{ matrix.shard }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-sqlite
      - name: Run complete Go unit suite with atomic coverage
        run: node scripts/ci-timings.mjs --run go-coverage-${{ matrix.shard }} -- node scripts/go-workspace.mjs coverage --shard=${{ matrix.shard }}
      - name: Upload successful shard profiles
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.shard }}
          path: coverage/go
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings
        with:
          suffix: -${{ matrix.shard }}

  coverage:
    name: Coverage gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [coverage-go]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Download every Go shard from this workflow run
        uses: actions/download-artifact@v8
        with:
          pattern: go-coverage-*
          path: coverage/go-shards
      - name: Enforce the complete Go coverage floor
        run: node scripts/ci-timings.mjs --run go-coverage-union -- node scripts/merge-go-coverage.mjs coverage/go-shards
      - name: Run TypeScript tests once with coverage floors
        run: node scripts/run-ci-targets.mjs ts-coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/go
            ts/agent-runtime-client/coverage
          if-no-files-found: error
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings

  security:
    name: Vulnerability audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies for security regression tests
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan Go and Node dependencies
        run: node scripts/run-ci-targets.mjs security
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings

  integration-shards:
    name: Real-engine integration (${{ matrix.suite }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [kernel, harness, redis, continuation]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_runtime
          POSTGRES_PASSWORD: agent_runtime
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_runtime -d agent_runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://agent_runtime:agent_runtime@127.0.0.1:5432/agent_runtime?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: integration-${{ matrix.suite }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/setup-sqlite
      - name: Run the complete original real-engine shard
        env:
          CI_INTEGRATION_SUITE: ${{ matrix.suite }}
        run: node scripts/ci-timings.mjs --run "integration-$CI_INTEGRATION_SUITE" -- node scripts/run-integration.mjs --external-services "--suite=$CI_INTEGRATION_SUITE"
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings
        with:
          suffix: -${{ matrix.suite }}

  integration:
    # The existing independently required context is not a matrix child.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Full real-engine integration (milestone)' || 'PostgreSQL and Redis integration' }}
    if: ${{ always() }}
    needs: [integration-shards]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Require all real-engine shards (Draft is deliberately blocked)
        env:
          INTEGRATION_RESULT: ${{ needs.integration-shards.result }}
        run: |
          if [[ "$INTEGRATION_RESULT" != success ]]; then
            echo "::error::Complete real-engine integration has not passed ($INTEGRATION_RESULT). Draft Fast CI is not merge authorization."
            exit 1
          fi

  observability:
    name: OpenTelemetry Collector E2E
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Run Collector trace and metric gate
        run: node scripts/run-ci-targets.mjs integration-otel
      - name: Publish CI timing baseline
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-ci-timings
