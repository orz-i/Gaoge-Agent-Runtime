name: Set up Go with shared downloads and isolated build caches
description: Share modules, isolate mode/shard builds, and avoid per-commit PR snapshots.
inputs:
  cache-scope:
    description: Build cache scope; matrix jobs must include their shard.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      id: go
      with:
        go-version-file: go.work
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope || github.job }}
        GO_VERSION: ${{ steps.go.outputs.go-version }}
        DEPENDENCIES_HASH: ${{ hashFiles('go.work', 'go.work.sum', '**/go.mod', '**/go.sum') }}
        SOURCE_SHA: ${{ github.sha }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        [[ "$CACHE_SCOPE" =~ ^[a-zA-Z0-9_-]+$ ]]
        source /etc/os-release
        base="$ID-$VERSION_ID-$RUNNER_ARCH-go-$GO_VERSION"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules-key=$base-modules-v2-$DEPENDENCIES_HASH" >> "$GITHUB_OUTPUT"
        echo "modules-prefix=$base-modules-v2-" >> "$GITHUB_OUTPUT"
        echo "build-key=$base-build-$CACHE_SCOPE-v2-$DEPENDENCIES_HASH-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        echo "build-prefix=$base-build-$CACHE_SCOPE-v2-$DEPENDENCIES_HASH-" >> "$GITHUB_OUTPUT"
        echo "build-fallback=$base-build-$CACHE_SCOPE-v2-" >> "$GITHUB_OUTPUT"
    - name: Share the content-addressed module download cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: ${{ steps.paths.outputs.modules-key }}
        restore-keys: ${{ steps.paths.outputs.modules-prefix }}
    - name: Refresh build caches on trusted main pushes only
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: ${{ steps.paths.outputs.build-key }}
        restore-keys: |
          ${{ steps.paths.outputs.build-prefix }}
          ${{ steps.paths.outputs.build-fallback }}
    - name: Restore build caches without PR snapshot uploads
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: ${{ steps.paths.outputs.build-key }}
        restore-keys: |
          ${{ steps.paths.outputs.build-prefix }}
          ${{ steps.paths.outputs.build-fallback }}
