version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /go/agent-runtime
      - /go/agent-runtime-harness
      - /go/agent-runtime-harness-postgres
      - /go/agent-runtime-http
      - /go/agent-runtime-mcp
      - /go/agent-runtime-a2a
      - /go/agent-runtime-postgres
      - /go/agent-runtime-redis
    schedule:
      interval: weekly
    # The modules are released together and depend on sibling prerelease tags.
    # Coordinate routine Go upgrades through the full workspace gate while
    # retaining Dependabot security updates and vulnerability alerts.
    open-pull-requests-limit: 0
    groups:
      go-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      node-toolchain:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
