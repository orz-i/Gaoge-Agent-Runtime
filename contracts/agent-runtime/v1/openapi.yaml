openapi: 3.0.3
info:
  title: Agent Runtime API
  version: 1.0.0
paths:
  /agent-runs:
    post:
      operationId: createAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAgentRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs:
    post:
      operationId: createPlanRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartPlanRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs/{runID}/approval:
    post:
      operationId: resolvePlanApproval
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolvePlanApprovalRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs:
    post:
      operationId: createWorkflowRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartWorkflowRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs/{runID}/wait:
    post:
      operationId: resolveWorkflowWait
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveWorkflowWaitRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs/{runID}/cancel:
    post:
      operationId: cancelWorkflowRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '200':
          description: Cancelled after feature-owned compensation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs/{runID}/trace:
    get:
      operationId: getWorkflowTrace
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Redacted Workflow trace without input, output, prompt, token, or secret content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowTrace'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-definitions/compile:
    post:
      operationId: compileWorkflowDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompileWorkflowDefinitionRequest'}
      responses:
        '200':
          description: Compiled proposal, structural diff, and policy impact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDefinitionProposalReport'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-definitions:
    get:
      operationId: listWorkflowDefinitions
      responses:
        '200':
          description: Most-specific visible immutable definition heads
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkflowDefinitionHead'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: publishWorkflowDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishWorkflowDefinitionRequest'}
      responses:
        '201':
          description: Published immutable revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishWorkflowDefinitionResponse'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-definitions/{definitionID}/revisions/{revision}:
    get:
      operationId: getWorkflowDefinitionRevision
      parameters:
        - name: definitionID
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: revision
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: scope
          in: query
          required: false
          schema: {type: string, enum: [system, tenant, actor], default: actor}
      responses:
        '200':
          description: Exact historical revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDefinitionRevision'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-definitions/{definitionID}/activation:
    post:
      operationId: setWorkflowDefinitionActivation
      parameters:
        - name: definitionID
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWorkflowDefinitionActivationRequest'}
      responses:
        '200':
          description: Updated CAS-controlled active pointer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetWorkflowDefinitionActivationResponse'}
        default: {$ref: '#/components/responses/Error'}
  /team-runs:
    post:
      operationId: createTeamRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartTeamRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/events:
    get:
      operationId: listRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/EventPageLimit'
      responses:
        '200':
          description: Bounded page from the durable Kernel Event journal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunEventPage'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/feed:
    get:
      operationId: streamRunFeed
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Run Feed event stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/RunFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/workbench:
    get:
      operationId: getWorkbench
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Workbench detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workbench'}
        default: {$ref: '#/components/responses/Error'}
  /harness/commands:
    get:
      operationId: listHarnessCommands
      responses:
        '200':
          description: Discoverable Harness command descriptors
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HarnessCommand'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}:
    get:
      operationId: getHarnessTurn
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      responses:
        '200':
          description: Durable Harness Turn snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/feed:
    get:
      operationId: streamHarnessTurnFeed
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Harness Turn semantic item stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/HarnessFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/approval:
    post:
      operationId: resolveHarnessApproval
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessApprovalRequest'}
      responses:
        '200':
          description: Harness approval resolved on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/interactions/{interactionID}:
    post:
      operationId: resolveHarnessInteraction
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/HarnessInteractionID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessInteractionRequest'}
      responses:
        '200':
          description: Harness interaction response recorded on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/invocations/{invocationID}/retry:
    post:
      operationId: retryHarnessInvocation
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/HarnessInvocationID'
      responses:
        '200':
          description: Harness child Invocation retried as the next durable attempt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/subtasks/{subtaskID}/cancel:
    post:
      operationId: cancelHarnessSubtask
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - name: subtaskID
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Updated durable Turn with authoritative subtask and budget projections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/subtasks/{subtaskID}/approval:
    post:
      operationId: resolveHarnessSubtaskApproval
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - name: subtaskID
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkpointID, decision]
              properties:
                checkpointID: {type: string, minLength: 1}
                decision: {type: string, enum: [approve, reject]}
                comment: {type: string}
      responses:
        '200':
          description: Updated durable Turn with authoritative subtask and budget projections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInteractionID:
      name: interactionID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInvocationID:
      name: invocationID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessTurnID:
      name: turnID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    EventPageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RunFeedCursorExpired:
      description: Error code `runfeed.cursor_expired`. Restore the durable Run snapshot before continuing from the returned high-water mark.
      headers:
        X-Run-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    HarnessFeedCursorExpired:
      description: Error code `harness.feed_cursor_expired`. Restore the durable Harness Turn snapshot before continuing from the returned high-water mark.
      headers:
        X-Harness-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      required: [tenantID, actorID]
      properties:
        tenantID: {type: string}
        actorID: {type: string}
    ThreadRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    HostRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    ThreadRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    TextInputRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, maxLength: 200000}
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    StartPlanRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        approvalPolicy: {type: string, enum: [auto, required]}
        maxSteps: {type: integer, minimum: 1, maximum: 32}
    ResolvePlanApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, decision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2000}
    ResolveHarnessApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string}
    ResolveHarnessInteractionRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: {}
    StartWorkflowRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, input]
      oneOf:
        - required: [definition]
        - required: [definitionReference]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        definition: {$ref: '#/components/schemas/WorkflowDefinitionDraft'}
        definitionReference: {$ref: '#/components/schemas/WorkflowDefinitionReference'}
        input: {}
    ResolveWorkflowWaitRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, response]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        response: {}
    WorkflowDefinitionDraft:
      type: object
      additionalProperties: true
      required: [id, revision, name, nodes]
      properties:
        id: {type: string, minLength: 1, maxLength: 255}
        revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 1000}
        inputSchema: {}
        outputSchema: {}
        nodes: {type: array, minItems: 1, items: {type: object, additionalProperties: true}}
        limits: {type: object, additionalProperties: true}
        policy: {type: object, additionalProperties: true}
    WorkflowDefinitionReference:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, minLength: 1, maxLength: 255}
        revision: {type: integer, minimum: 1}
        hash: {type: string, minLength: 1}
    WorkflowDefinitionScopeRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [system, tenant, actor]}
    CompileWorkflowDefinitionRequest:
      type: object
      additionalProperties: false
      required: [scope, draft]
      properties:
        scope: {$ref: '#/components/schemas/WorkflowDefinitionScopeRequest'}
        baseRevision: {type: integer, minimum: 0}
        draft: {$ref: '#/components/schemas/WorkflowDefinitionDraft'}
    PublishWorkflowDefinitionRequest:
      type: object
      additionalProperties: false
      required: [scope, draft]
      properties:
        scope: {$ref: '#/components/schemas/WorkflowDefinitionScopeRequest'}
        draft: {$ref: '#/components/schemas/WorkflowDefinitionDraft'}
        expectedRevision: {type: integer, minimum: 0}
        mode: {type: string, enum: [activate, stage]}
        idempotencyKey: {type: string, minLength: 1, maxLength: 200}
    SetWorkflowDefinitionActivationRequest:
      type: object
      additionalProperties: false
      required: [scope, availability, expectedVersion]
      properties:
        scope: {$ref: '#/components/schemas/WorkflowDefinitionScopeRequest'}
        targetRevision: {type: integer, minimum: 0}
        availability: {type: string, enum: [active, disabled]}
        expectedVersion: {type: integer, minimum: 1}
    WorkflowDefinitionProposalReport:
      type: object
      additionalProperties: true
    WorkflowDefinitionHead:
      type: object
      additionalProperties: true
    WorkflowDefinitionRevision:
      type: object
      additionalProperties: true
    PublishWorkflowDefinitionResponse:
      type: object
      additionalProperties: false
      required: [revision, head, reused]
      properties:
        revision: {$ref: '#/components/schemas/WorkflowDefinitionRevision'}
        head: {$ref: '#/components/schemas/WorkflowDefinitionHead'}
        reused: {type: boolean}
    SetWorkflowDefinitionActivationResponse:
      type: object
      additionalProperties: false
      required: [head, reused]
      properties:
        head: {$ref: '#/components/schemas/WorkflowDefinitionHead'}
        reused: {type: boolean}
    WorkflowTrace:
      type: object
      additionalProperties: true
      description: Redacted operational trace; content-bearing inputs and outputs are excluded.
    TeamMemberRequest:
      type: object
      additionalProperties: false
      required: [id, goal]
      properties:
        id: {type: string, maxLength: 128}
        goal: {type: string, maxLength: 200000}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    TeamJoinRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [all, any, quorum]}
        quorum: {type: integer, minimum: 1, maximum: 16}
        failurePolicy: {type: string, enum: [collect, fail_fast]}
    StartTeamRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, mode, members, join]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        mode: {type: string, enum: [sequential, parallel]}
        members:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/TeamMemberRequest'}
        join: {$ref: '#/components/schemas/TeamJoinRequest'}
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
    Run:
      type: object
      additionalProperties: false
      required: [id, kind, actor, thread, goal, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [agent, plan_execute, workflow, team]}
        actor: {$ref: '#/components/schemas/ActorRef'}
        thread: {$ref: '#/components/schemas/ThreadRef'}
        requestID: {type: string}
        goal: {type: string}
        status: {type: string, enum: [running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [seq, type, createdAt]
      properties:
        seq: {type: integer}
        type: {type: string}
        message: {type: string}
        data: {}
        createdAt: {type: string, format: date-time}
    RunFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, runID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        runID: {type: string}
        type: {type: string}
        delta: {type: string}
        message: {type: string}
        data: {}
        revision: {type: integer, minimum: 1}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessTurn:
      type: object
      additionalProperties: false
      required: [id, hostTurn, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        hostTurn: {$ref: '#/components/schemas/HostRef'}
        status: {type: string, enum: [accepted, running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessItem:
      type: object
      additionalProperties: false
      required: [id, turnID, seq, kind, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        seq: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic, budget, subtask]
        status: {type: string, enum: [started, waiting, completed, failed, cancelled]}
        hostRef: {$ref: '#/components/schemas/HostRef'}
        invocationID: {type: string}
        parentItemID: {type: string}
        payload: {}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessTurnFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, turnID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        turnID: {type: string}
        type:
          type: string
          enum: [turn.started, turn.waiting_input, turn.completed, turn.failed, turn.cancelled, item.started, item.delta, item.completed]
        itemID: {type: string}
        itemKind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic, budget, subtask]
        delta: {type: string}
        message: {type: string}
        data: {}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessCapabilityInvocation:
      type: object
      additionalProperties: false
