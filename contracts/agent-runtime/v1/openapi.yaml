openapi: 3.0.3
info:
  title: Agent Runtime API
  version: 1.0.0
paths:
  /agent-runs:
    post:
      operationId: createAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAgentRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs:
    post:
      operationId: createPlanRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartPlanRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs/{runID}/approval:
    post:
      operationId: resolvePlanApproval
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolvePlanApprovalRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs:
    post:
      operationId: createWorkflowRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartWorkflowRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs/{runID}/wait:
    post:
      operationId: resolveWorkflowWait
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveWorkflowWaitRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /team-runs:
    post:
      operationId: createTeamRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartTeamRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/feed:
    get:
      operationId: streamRunFeed
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Run Feed event stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/RunFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/workbench:
    get:
      operationId: getWorkbench
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Workbench detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workbench'}
        default: {$ref: '#/components/responses/Error'}
  /harness/commands:
    get:
      operationId: listHarnessCommands
      responses:
        '200':
          description: Discoverable Harness command descriptors
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/HarnessCommand'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}:
    get:
      operationId: getHarnessTurn
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      responses:
        '200':
          description: Durable Harness Turn snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/feed:
    get:
      operationId: streamHarnessTurnFeed
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Harness Turn semantic item stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/HarnessFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/approval:
    post:
      operationId: resolveHarnessApproval
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessApprovalRequest'}
      responses:
        '200':
          description: Harness approval resolved on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/interactions/{interactionID}:
    post:
      operationId: resolveHarnessInteraction
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/HarnessInteractionID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessInteractionRequest'}
      responses:
        '200':
          description: Harness interaction response recorded on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/invocations/{invocationID}/retry:
    post:
      operationId: retryHarnessInvocation
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/HarnessInvocationID'
      responses:
        '200':
          description: Harness child Invocation retried as the next durable attempt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInteractionID:
      name: interactionID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInvocationID:
      name: invocationID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessTurnID:
      name: turnID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RunFeedCursorExpired:
      description: Error code `runfeed.cursor_expired`. Restore the durable Run snapshot before continuing from the returned high-water mark.
      headers:
        X-Run-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    HarnessFeedCursorExpired:
      description: Error code `harness.feed_cursor_expired`. Restore the durable Harness Turn snapshot before continuing from the returned high-water mark.
      headers:
        X-Harness-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      required: [tenantID, actorID]
      properties:
        tenantID: {type: string}
        actorID: {type: string}
    ThreadRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    HostRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    ThreadRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    TextInputRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, maxLength: 200000}
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    StartPlanRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        approvalPolicy: {type: string, enum: [auto, required]}
        maxSteps: {type: integer, minimum: 1, maximum: 32}
    ResolvePlanApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, decision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2000}
    ResolveHarnessApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string}
    ResolveHarnessInteractionRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: {}
    StartWorkflowRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, definition, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        definition: {type: object, additionalProperties: true}
        input: {}
    ResolveWorkflowWaitRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, response]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        response: {}
    TeamMemberRequest:
      type: object
      additionalProperties: false
      required: [id, goal]
      properties:
        id: {type: string, maxLength: 128}
        goal: {type: string, maxLength: 200000}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    TeamJoinRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [all, any, quorum]}
        quorum: {type: integer, minimum: 1, maximum: 16}
        failurePolicy: {type: string, enum: [collect, fail_fast]}
    StartTeamRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, mode, members, join]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        mode: {type: string, enum: [sequential, parallel]}
        members:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/TeamMemberRequest'}
        join: {$ref: '#/components/schemas/TeamJoinRequest'}
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
    Run:
      type: object
      additionalProperties: false
      required: [id, kind, actor, thread, goal, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [agent, plan_execute, workflow, team]}
        actor: {$ref: '#/components/schemas/ActorRef'}
        thread: {$ref: '#/components/schemas/ThreadRef'}
        requestID: {type: string}
        goal: {type: string}
        status: {type: string, enum: [running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [seq, type, createdAt]
      properties:
        seq: {type: integer}
        type: {type: string}
        message: {type: string}
        data: {}
        createdAt: {type: string, format: date-time}
    RunFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, runID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        runID: {type: string}
        type: {type: string}
        delta: {type: string}
        message: {type: string}
        data: {}
        revision: {type: integer, minimum: 1}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessTurn:
      type: object
      additionalProperties: false
      required: [id, hostTurn, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        hostTurn: {$ref: '#/components/schemas/HostRef'}
        status: {type: string, enum: [accepted, running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessItem:
      type: object
      additionalProperties: false
      required: [id, turnID, seq, kind, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        seq: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic]
        status: {type: string, enum: [started, waiting, completed, failed, cancelled]}
        hostRef: {$ref: '#/components/schemas/HostRef'}
        invocationID: {type: string}
        parentItemID: {type: string}
        payload: {}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessTurnFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, turnID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        turnID: {type: string}
        type:
          type: string
          enum: [turn.started, turn.waiting_input, turn.completed, turn.failed, turn.cancelled, item.started, item.delta, item.completed]
        itemID: {type: string}
        itemKind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic]
        delta: {type: string}
        message: {type: string}
        data: {}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessCapabilityInvocation:
      type: object
      additionalProperties: false
      required: [id, turnID, capabilityKey, executionClass, status, attempt, outputRefs, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        parentItemID: {type: string}
        capabilityKey: {type: string}
        definitionVersion: {type: string}
        executionClass: {type: string, enum: [agent, team, plan_execute, workflow, application]}
        inputHash: {type: string}
        status: {type: string, enum: [accepted, running, waiting_input, completed, failed, cancelled]}
        attempt: {type: integer, minimum: 1}
        outputRefs:
          type: array
          items: {$ref: '#/components/schemas/HostRef'}
        errorCode: {type: string}
        errorDetail: {type: string}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessInteraction:
      type: object
      additionalProperties: false
      required: [id, turnID, invocationID, key, kind, schema, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        invocationID: {type: string}
        parentItemID: {type: string}
        key: {type: string}
        kind: {type: string, enum: [choice, confirmation, input]}
        schema: {}
        presentation: {}
        status: {type: string, enum: [waiting, resolved]}
        response: {}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessCommand:
      type: object
      additionalProperties: false
      required: [id, trigger, title, capabilityKey, definitionVersion, executionClass, source, inputSchema]
      properties:
        id: {type: string}
        trigger: {type: string}
        title: {type: string}
        description: {type: string}
        capabilityKey: {type: string}
        definitionVersion: {type: string}
        executionClass: {type: string, enum: [agent, team, plan_execute, workflow, application]}
        source: {type: string, enum: [first_party, application]}
        inputSchema: {}
    HarnessTurnSnapshot:
      type: object
      additionalProperties: false
      required: [turn, invocations, interactions, items]
      properties:
        turn: {$ref: '#/components/schemas/HarnessTurn'}
        invocations:
          type: array
          items: {$ref: '#/components/schemas/HarnessCapabilityInvocation'}
        interactions:
          type: array
          items: {$ref: '#/components/schemas/HarnessInteraction'}
        items:
          type: array
          items: {$ref: '#/components/schemas/HarnessItem'}
        output: {$ref: '#/components/schemas/Result'}
    Checkpoint:
      type: object
      additionalProperties: true
    Result:
      type: object
      additionalProperties: true
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [run, state, events]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        state: {}
        checkpoint: {$ref: '#/components/schemas/Checkpoint'}
        result: {$ref: '#/components/schemas/Result'}
        events:
          type: array
          items: {$ref: '#/components/schemas/Event'}
    CancelRunResponse:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: '#/components/schemas/Run'}
    WorkbenchOverview:
      type: object
      additionalProperties: false
      required:
        - runID
        - kind
        - goal
        - status
        - revision
        - eventCount
        - hasCheckpoint
        - hasResult
      properties:
        runID: {type: string}
        kind: {type: string, enum: [agent, plan_execute, workflow, team]}
        goal: {type: string}
        status: {type: string, enum: [running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        eventCount: {type: integer, minimum: 0}
        hasCheckpoint: {type: boolean}
        hasResult: {type: boolean}
    WorkbenchSection:
      type: object
      additionalProperties: false
      required: [name, available]
      properties:
        name: {type: string}
        available: {type: boolean}
        content: {}
        hash: {type: string}
    WorkbenchTimelineItem:
      type: object
      additionalProperties: false
      required: [id, source, kind, createdAt]
      properties:
        id: {type: string}
        source: {type: string}
        kind: {type: string}
        status: {type: string}
        title: {type: string}
        summary: {type: string}
        seq: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        data: {}
    WorkbenchDiagnostic:
      type: object
      additionalProperties: false
      required: [provider, operation, code]
      properties:
        provider: {type: string}
        operation: {type: string}
        code: {type: string}
        message: {type: string}
    TopologyNode:
      type: object
      additionalProperties: false
      required: [id, kind, label, status]
      properties:
        id: {type: string}
        kind: {type: string}
        label: {type: string}
        status: {type: string}
        runID: {type: string}
        groupID: {type: string}
        data: {}
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [id, source, target, kind]
      properties:
        id: {type: string}
        source: {type: string}
        target: {type: string}
        kind:
          type: string
          enum: [sequence, dependency, delegation, handoff, produces, consumes]
        status: {type: string}
        data: {}
    TopologyV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, rootNodeID, revision, hash, nodes, edges]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        rootNodeID: {type: string}
        revision: {type: integer, minimum: 1}
        hash: {type: string}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/TopologyNode'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/TopologyEdge'}
    Workbench:
      type: object
      additionalProperties: false
      required: [overview, run, sections, timeline, hash]
      properties:
        overview: {$ref: '#/components/schemas/WorkbenchOverview'}
        run: {$ref: '#/components/schemas/Run'}
        checkpoint: {$ref: '#/components/schemas/Checkpoint'}
        result: {$ref: '#/components/schemas/Result'}
        sections:
          type: array
          items: {$ref: '#/components/schemas/WorkbenchSection'}
        timeline:
          type: array
          items: {$ref: '#/components/schemas/WorkbenchTimelineItem'}
        topology: {$ref: '#/components/schemas/TopologyV1'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/WorkbenchDiagnostic'}
        hash: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestID]
          properties:
            code: {type: string}
            message: {type: string}
            requestID: {type: string}
