openapi: 3.0.3
info:
  title: Agent Runtime HTTP API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /runs:
    get:
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/ThreadKind'
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Runtime runs for one host thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Accepted run and durable host projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResult'
        default:
          $ref: '#/components/responses/Error'
  /agent-teams:
    post:
      operationId: startAgentTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentTeamRequest'
      responses:
        '202':
          description: Accepted coordinator-led Agent Team with durable member handoffs and fan-in join
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeamStartResult'
        default:
          $ref: '#/components/responses/Error'
  /agent-manifests:
    get:
      operationId: listAgentManifests
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active Agent Manifest catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifestPage'
        default:
          $ref: '#/components/responses/Error'
  /agent-manifests/{manifestID}:
    get:
      operationId: getAgentManifest
      parameters:
        - $ref: '#/components/parameters/AgentManifestID'
        - $ref: '#/components/parameters/OptionalRevision'
      responses:
        '200':
          description: One immutable Agent Manifest revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifest'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/handoffs:
    post:
      operationId: delegateRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateRunRequest'
      responses:
        '202':
          description: Accepted delegated child run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedRunResult'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/handoff-joins:
    post:
      operationId: createRunHandoffJoin
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunHandoffJoinRequest'
      responses:
        '201':
          description: Created durable handoff fan-in contract and paused the parent run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandoffJoin'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listRunHandoffJoins
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/RunHandoffJoinStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Durable handoff fan-in contracts for the parent run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandoffJoinPage'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/handoff-joins/{joinID}:
    get:
      operationId: getRunHandoffJoin
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/RunHandoffJoinID'
      responses:
        '200':
          description: One durable handoff fan-in contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHandoffJoin'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/task-tree:
    get:
      operationId: getRunTaskTree
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Durable parent and child run task tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTaskTree'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run detail and durable host projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRunRequest'
      responses:
        '202':
          description: Accepted resume request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/retire:
    post:
      operationId: retireRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Retired run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetireRunResponse'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Ordered NDJSON Runtime events
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/events/history:
    get:
      operationId: listRunEventHistory
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/BeforeSeq'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Historical Runtime events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHistoryPage'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/events/{eventID}:
    get:
      operationId: getRunEvent
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Runtime event with redacted diagnostic payloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/plan:
    get:
      operationId: getRunPlan
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Current plan and revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/interactions:
    get:
      operationId: listRunInteractions
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Runtime interactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionList'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/interactions/{interactionID}/resolve:
    post:
      operationId: resolveRunInteraction
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/InteractionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveInteractionRequest'
      responses:
        '200':
          description: Resolved Runtime interaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/checkpoints:
    get:
      operationId: listRunCheckpoints
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Durable Runtime checkpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointList'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/outputs:
    get:
      operationId: listRunOutputs
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Outputs created by the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputList'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runID}/workbench:
    get:
      operationId: getRunWorkbench
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Durable Runtime workbench projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workbench'
        default:
          $ref: '#/components/responses/Error'
  /run-queue:
    get:
      operationId: listQueue
      parameters:
        - $ref: '#/components/parameters/ThreadKind'
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Durable queue for one host thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: enqueueRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueCreateRequest'
      responses:
        '202':
          description: Accepted queue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCreateResponse'
        default:
          $ref: '#/components/responses/Error'
  /run-queue/{queueID}:
    patch:
      operationId: updateQueueItem
      parameters:
        - $ref: '#/components/parameters/QueueID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueUpdateRequest'
      responses:
        '200':
          description: Updated queue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelQueueItem
      parameters:
        - $ref: '#/components/parameters/QueueID'
        - $ref: '#/components/parameters/ThreadKind'
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Cancelled queue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        default:
          $ref: '#/components/responses/Error'
  /run-queue/{queueID}/prioritize:
    post:
      operationId: prioritizeQueueItem
      parameters:
        - $ref: '#/components/parameters/QueueID'
        - $ref: '#/components/parameters/ThreadKind'
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Prioritized queue item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        default:
          $ref: '#/components/responses/Error'
  /run-queue/{queueID}/interrupt-and-send:
    post:
      operationId: interruptAndSendQueueItem
      parameters:
        - $ref: '#/components/parameters/QueueID'
        - $ref: '#/components/parameters/ThreadKind'
        - $ref: '#/components/parameters/ThreadID'
      responses:
        '200':
          description: Queue item selected after interrupting the active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItem'
        default:
          $ref: '#/components/responses/Error'
  /outputs:
    get:
      operationId: listOutputs
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actor output catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputCatalogPage'
        default:
          $ref: '#/components/responses/Error'
  /outputs/{outputID}:
    get:
      operationId: getOutput
      parameters:
        - $ref: '#/components/parameters/OutputID'
        - $ref: '#/components/parameters/OptionalVersion'
      responses:
        '200':
          description: One output version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputCatalogItem'
        default:
          $ref: '#/components/responses/Error'
  /outputs/{outputID}/versions:
    get:
      operationId: listOutputVersions
      parameters:
        - $ref: '#/components/parameters/OutputID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Version history for one output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputVersionPage'
        default:
          $ref: '#/components/responses/Error'
  /outputs/{outputID}/versions/{version}/preview:
    get:
      operationId: previewOutputVersion
      parameters:
        - $ref: '#/components/parameters/OutputID'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Renderable output preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputPreviewResult'
        default:
          $ref: '#/components/responses/Error'
  /outputs/{outputID}/versions/{version}/download:
    get:
      operationId: downloadOutputVersion
      parameters:
        - $ref: '#/components/parameters/OutputID'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Output file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /evidence:
    post:
      operationId: createEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceRequest'
      responses:
        '200':
          description: Frozen Runtime evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        default:
          $ref: '#/components/responses/Error'
  /admin/agentruntime/continuations:
    get:
      operationId: listContinuationJobs
      parameters:
        - {name: tenantID, in: query, required: false, schema: {type: string}}
        - {name: actorID, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [queued, running, retry_wait, completed, dead_letter]}}
        - {name: runID, in: query, required: false, schema: {type: string}}
        - {name: jobID, in: query, required: false, schema: {type: string}}
        - {name: source, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 200, default: 50}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Operator view of durable continuation jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuationJobPage'
        default:
          $ref: '#/components/responses/Error'
  /admin/agentruntime/continuations/{jobID}/requeue:
    post:
      operationId: requeueContinuationJob
      parameters:
        - $ref: '#/components/parameters/ContinuationJobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequeueContinuationRequest'
      responses:
        '200':
          description: Requeued recoverable continuation job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuationJob'
        default:
          $ref: '#/components/responses/Error'
  /admin/agentruntime/agent-manifests:
    get:
      operationId: listAdminAgentManifests
      parameters:
        - $ref: '#/components/parameters/AgentManifestStatus'
        - $ref: '#/components/parameters/AgentManifestScope'
        - $ref: '#/components/parameters/AgentManifestTenantID'
        - $ref: '#/components/parameters/AgentManifestOwnerActorID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Latest Agent Manifest revisions for administrators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifestPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAgentManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentManifestRevisionRequest'
      responses:
        '201':
          description: Created Agent Manifest revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifest'
        default:
          $ref: '#/components/responses/Error'
  /admin/agentruntime/agent-manifests/{manifestID}/revisions:
    post:
      operationId: reviseAgentManifest
      parameters:
        - $ref: '#/components/parameters/AgentManifestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentManifestRevisionRequest'
      responses:
        '201':
          description: Appended Agent Manifest revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifest'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string}
    RunHandoffJoinID:
      name: joinID
      in: path
      required: true
      schema: {type: string}
    AgentManifestID:
      name: manifestID
      in: path
      required: true
      schema: {type: string}
    ContinuationJobID:
      name: jobID
      in: path
      required: true
      schema: {type: string}
    EventID:
      name: eventID
      in: path
      required: true
      schema: {type: string}
    InteractionID:
      name: interactionID
      in: path
      required: true
      schema: {type: string}
    QueueID:
      name: queueID
      in: path
      required: true
      schema: {type: string}
    OutputID:
      name: outputID
      in: path
      required: true
      schema: {type: string}
    Version:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    AgentManifestStatus:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [active, disabled]}
    AgentManifestScope:
      name: scope
      in: query
      required: false
      schema: {type: string, enum: [actor, tenant, system]}
    AgentManifestTenantID:
      name: tenantID
      in: query
      required: false
      schema: {type: string, maxLength: 64}
    AgentManifestOwnerActorID:
      name: ownerActorID
      in: query
      required: false
      schema: {type: string, maxLength: 64}
    RunHandoffJoinStatus:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [pending, ready, failed, cancelled]}
    OptionalRevision:
      name: revision
      in: query
      required: false
      schema: {type: string}
    OptionalVersion:
      name: version
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    ThreadKind:
      name: threadKind
      in: query
      required: true
      schema: {type: string}
    ThreadID:
      name: threadID
      in: query
      required: true
      schema: {type: string}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 20}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    SearchQuery:
      name: q
      in: query
      required: false
      schema: {type: string}
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 0}
    BeforeSeq:
      name: beforeSeq
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    Error:
      description: Stable Runtime error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        tenantID: {type: string}
        id: {type: string}
    ThreadRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string}
        id: {type: string}
    ProjectionRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string}
        id: {type: string}
    ResourceRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string}
        id: {type: string}
        revision: {type: string}
    AgentManifestRevisionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        manifestID: {type: string, maxLength: 64}
        expectedRevision: {type: integer, minimum: 0}
        scope: {type: string, enum: [actor, tenant, system]}
        tenantID: {type: string, maxLength: 64}
        ownerActorID: {type: string, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4000}
        instructions: {type: string, maxLength: 20000}
        status: {type: string, enum: [active, disabled]}
        modelName: {type: string, maxLength: 128}
        executionMode: {type: string, enum: [auto, direct, plan]}
        toolKeys: {type: array, maxItems: 128, items: {type: string}}
        skillKeys: {type: array, maxItems: 128, items: {type: string}}
        maxChildRuns: {type: integer, minimum: 1, maximum: 16}
        maxDepth: {type: integer, minimum: 1, maximum: 6}
        maxLLMCalls: {type: integer, minimum: 2, maximum: 32, description: Zero or omitted inherits the environment limit.}
        maxToolCalls: {type: integer, minimum: 1, maximum: 64, description: Zero or omitted inherits the environment limit.}
        revisionNote: {type: string, maxLength: 255}
    AgentManifest:
      type: object
      additionalProperties: false
      required: [manifestID, revision, ref, scope, tenantID, ownerActorID, name, status, toolKeys, skillKeys, maxChildRuns, maxDepth, maxLLMCalls, maxToolCalls, createdAt, updatedAt]
      properties:
        manifestID: {type: string}
        revision: {type: integer, minimum: 1}
        ref:
          $ref: '#/components/schemas/ResourceRef'
        scope: {type: string, enum: [actor, tenant, system]}
        tenantID: {type: string}
        ownerActorID: {type: string}
        name: {type: string}
        description: {type: string}
        instructions: {type: string}
        status: {type: string, enum: [active, disabled]}
        modelName: {type: string}
        executionMode: {type: string, enum: [auto, direct, plan]}
        toolKeys: {type: array, items: {type: string}}
        skillKeys: {type: array, items: {type: string}}
        maxChildRuns: {type: integer, minimum: 1}
        maxDepth: {type: integer, minimum: 1}
