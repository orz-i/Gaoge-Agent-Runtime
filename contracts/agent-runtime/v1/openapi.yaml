openapi: 3.0.3
info:
  title: Agent Runtime HTTP API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /runs:
    get:
      operationId: listRuns
      parameters:
        - {name: threadKind, in: query, required: true, schema: {type: string}}
        - {name: threadID, in: query, required: true, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    post:
      operationId: createRun
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRunRequest'}}}}
      responses: {'202': {description: Text Run and durable host projections, content: {application/json: {schema: {$ref: '#/components/schemas/RunProjectionResult'}}}}, default: {$ref: '#/components/responses/Error'}}
  /runs/{runID}:
    get:
      operationId: getRun
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {description: Text Run detail and durable host projections, content: {application/json: {schema: {$ref: '#/components/schemas/RunProjectionResult'}}}}, default: {$ref: '#/components/responses/Error'}}
  /runs/{runID}/cancel:
    post: {$ref: '#/components/pathItems/runAction'}
  /runs/{runID}/resume:
    post: {$ref: '#/components/pathItems/runAction'}
  /runs/{runID}/retire:
    post: {$ref: '#/components/pathItems/runAction'}
  /runs/{runID}/events:
    get:
      operationId: streamRunEvents
      parameters: [{$ref: '#/components/parameters/RunID'}, {name: afterSeq, in: query, schema: {type: integer, format: int64, minimum: 0}}]
      responses: {'200': {description: Ordered NDJSON runtime events, content: {application/x-ndjson: {schema: {$ref: '#/components/schemas/Event'}}}}, default: {$ref: '#/components/responses/Error'}}
  /runs/{runID}/events/history:
    get: {$ref: '#/components/pathItems/runRead'}
  /runs/{runID}/events/{eventID}:
    get:
      operationId: getRunEvent
      parameters: [{$ref: '#/components/parameters/RunID'}, {name: eventID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
  /runs/{runID}/plan:
    get: {$ref: '#/components/pathItems/runRead'}
  /runs/{runID}/interactions:
    get: {$ref: '#/components/pathItems/runRead'}
  /runs/{runID}/interactions/{interactionID}/resolve:
    post:
      operationId: resolveInteraction
      parameters: [{$ref: '#/components/parameters/RunID'}, {name: interactionID, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [clientResolveID, response], properties: {clientResolveID: {type: string}, response: {type: object}}}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
  /runs/{runID}/checkpoints:
    get: {$ref: '#/components/pathItems/runRead'}
  /runs/{runID}/outputs:
    get: {$ref: '#/components/pathItems/runRead'}
  /runs/{runID}/workbench:
    get: {$ref: '#/components/pathItems/runRead'}
  /run-queue:
    get:
      operationId: listQueue
      parameters:
        - {name: threadKind, in: query, required: true, schema: {type: string}}
        - {name: threadID, in: query, required: true, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    post:
      operationId: enqueueRun
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QueueRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
  /run-queue/{queueID}:
    patch: {$ref: '#/components/pathItems/queueAction'}
    delete: {$ref: '#/components/pathItems/queueAction'}
  /run-queue/{queueID}/prioritize:
    post: {$ref: '#/components/pathItems/queueAction'}
  /run-queue/{queueID}/interrupt-and-send:
    post: {$ref: '#/components/pathItems/queueAction'}
  /outputs:
    get:
      operationId: listOutputs
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
  /outputs/{outputID}:
    get: {$ref: '#/components/pathItems/outputRead'}
  /outputs/{outputID}/versions:
    get: {$ref: '#/components/pathItems/outputRead'}
  /outputs/{outputID}/versions/{version}/preview:
    get: {$ref: '#/components/pathItems/outputVersionRead'}
  /outputs/{outputID}/versions/{version}/download:
    get: {$ref: '#/components/pathItems/outputVersionRead'}
  /evidence:
    post:
      operationId: createEvidence
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEvidenceRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
components:
  parameters:
    RunID: {name: runID, in: path, required: true, schema: {type: string}}
  pathItems:
    runRead:
      operationId: readRunResource
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    runAction:
      operationId: mutateRun
      parameters: [{$ref: '#/components/parameters/RunID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '202': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    queueAction:
      operationId: mutateQueueItem
      parameters: [{name: queueID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    outputRead:
      operationId: readOutput
      parameters: [{name: outputID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
    outputVersionRead:
      operationId: readOutputVersion
      parameters: [{name: outputID, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/Success'}, default: {$ref: '#/components/responses/Error'}}
  responses:
    Success: {description: Runtime resource response, content: {application/json: {schema: {type: object}}}}
    Error: {description: Stable runtime error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ActorRef: {type: object, additionalProperties: false, required: [id], properties: {tenantID: {type: string}, id: {type: string}}}
    ThreadRef: {type: object, additionalProperties: false, required: [kind, id], properties: {kind: {type: string}, id: {type: string}}}
    ProjectionRef: {type: object, additionalProperties: false, required: [kind, id], properties: {kind: {type: string}, id: {type: string}}}
    ResourceRef: {type: object, additionalProperties: false, required: [kind, id], properties: {kind: {type: string}, id: {type: string}, revision: {type: string}}}
    RunProjectionResult: {type: object, required: [run, inputProjectionRef, outputProjectionRef], properties: {run: {type: object}, rootStep: {type: object}, steps: {type: array, items: {type: object}}, inputProjectionRef: {$ref: '#/components/schemas/ProjectionRef'}, outputProjectionRef: {$ref: '#/components/schemas/ProjectionRef'}, effectiveConfig: {type: object, properties: {environmentRef: {$ref: '#/components/schemas/ResourceRef'}, skillRefs: {type: array, items: {$ref: '#/components/schemas/ResourceRef'}}, unavailableSkillRefs: {type: array, items: {$ref: '#/components/schemas/ResourceRef'}}}}, context: {type: object}}}
    RunThread:
      allOf:
        - {$ref: '#/components/schemas/ThreadRef'}
        - {type: object, additionalProperties: false, properties: {parentProjection: {$ref: '#/components/schemas/ProjectionRef'}, sourceProjection: {$ref: '#/components/schemas/ProjectionRef'}, branchReason: {type: string, enum: [default, retry, edit]}}}
    RunInput: {type: object, additionalProperties: false, required: [content, contentType], properties: {content: {type: string}, contentType: {type: string, enum: [text, markdown]}, fileIDs: {type: array, items: {type: string}}, outputIDs: {type: array, items: {type: string}}, evidenceIDs: {type: array, items: {type: string}}}}
    CreateRunRequest: {type: object, additionalProperties: false, required: [thread, input], properties: {thread: {$ref: '#/components/schemas/RunThread'}, input: {$ref: '#/components/schemas/RunInput'}, clientRunID: {type: string}, model: {type: string}, executionMode: {type: string, enum: [auto, direct, plan]}, options: {type: object}, toolKeys: {type: array, items: {type: string}}, skillKeys: {type: array, items: {type: string}}, workspace: {type: object}}}
    QueueRequest: {allOf: [{$ref: '#/components/schemas/CreateRunRequest'}, {type: object, properties: {clientQueueID: {type: string}, expectedRevision: {type: integer}}}]}
    EvidenceSource: {oneOf: [{type: object, additionalProperties: false, required: [kind, id, version], properties: {kind: {type: string, enum: [output]}, id: {type: string}, version: {type: integer, minimum: 1}}}, {type: object, additionalProperties: false, required: [kind, thread, projection], properties: {kind: {type: string, enum: [projection]}, thread: {$ref: '#/components/schemas/ThreadRef'}, projection: {$ref: '#/components/schemas/ProjectionRef'}}}]}
    EvidenceSelection: {type: object, additionalProperties: false, required: [kind], properties: {kind: {type: string, enum: [full, text_range, table_range]}, title: {type: string}, start: {type: integer}, end: {type: integer}, rowStart: {type: integer}, rowEnd: {type: integer}, columnStart: {type: integer}, columnEnd: {type: integer}}}
    CreateEvidenceRequest: {type: object, additionalProperties: false, required: [source, selection], properties: {source: {$ref: '#/components/schemas/EvidenceSource'}, selection: {$ref: '#/components/schemas/EvidenceSelection'}}}
    Event: {type: object, required: [seq, type], properties: {projection: {$ref: '#/components/schemas/ProjectionRef'}, seq: {type: integer, format: int64}, type: {type: string}, payload: {type: object}}}
    ErrorResponse: {type: object, additionalProperties: false, required: [error], properties: {error: {type: object, additionalProperties: false, required: [code, message, requestID], properties: {code: {type: string}, message: {type: string}, requestID: {type: string}}}}}
