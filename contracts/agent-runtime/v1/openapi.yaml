openapi: 3.0.3
info:
  title: Agent Runtime API
  version: 1.0.0
  description: >-
    Endpoints using the strict JSON request decoder accept at most 8 MiB
    (8388608 bytes) of request body. A larger body returns HTTP 413 with
    error code request.body_too_large; malformed or invalid JSON returns 400.
paths:
  /agent-runs:
    post:
      operationId: createAgentRun
      requestBody:
        x-max-request-body-bytes: 8388608
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAgentRunRequest'}
      responses:
        '413': {$ref: '#/components/responses/RequestBodyTooLarge'}
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        x-max-request-body-bytes: 8388608
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '413': {$ref: '#/components/responses/RequestBodyTooLarge'}
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/events:
    get:
      operationId: listRunEvents
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/EventPageLimit'
      responses:
        '200':
          description: Bounded page from the durable Kernel Event journal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunEventPage'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/feed:
    get:
      operationId: streamRunFeed
      parameters:
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Run Feed event stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/RunFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}:
    get:
      operationId: getHarnessTurn
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      responses:
        '200':
          description: Durable Harness Turn snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/state:
    get:
      operationId: getHarnessTurnState
      description: >-
        Read persisted Session/Turn status without materializing the Timeline.
        This committed status does not certify Host assistant-output projection
        or independently synchronize an active Kernel Run.
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      responses:
        '200':
          description: Bounded owner-scoped committed Harness state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnState'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/items:
    get:
      operationId: listHarnessTurnItems
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/HarnessItemPageLimit'
      responses:
        '200':
          description: Bounded, owner-scoped, redacted durable Timeline page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTimelinePage'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/feed:
    get:
      operationId: streamHarnessTurnFeed
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/AfterSeq'
      responses:
        '200':
          description: Replayable Harness Turn semantic item stream
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/HarnessFeedCursorExpired'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/approval:
    post:
      operationId: resolveHarnessApproval
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessApprovalRequest'}
      responses:
        '200':
          description: Harness approval resolved on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/allowance:
    post:
      operationId: grantHarnessCallAllowance
      description: >-
        Authenticated owning Turn only. Grants one positive logical call
        increment within frozen Agent Run hard ceilings. Uses the public
        Turn revision; the private Agent Run identity and revision never
        appear in this request. Does not dispatch Tool or model calls.
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      requestBody:
        x-max-request-body-bytes: 8388608
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantHarnessCallAllowanceRequest'}
      responses:
        '413': {$ref: '#/components/responses/RequestBodyTooLarge'}
        '200':
          description: Paused Turn has returned to running with a durable wakeup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/interactions/{interactionID}:
    post:
      operationId: resolveHarnessInteraction
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - $ref: '#/components/parameters/HarnessInteractionID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveHarnessInteractionRequest'}
      responses:
        '200':
          description: Harness interaction response recorded on the same Turn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/subtasks:
    post:
      operationId: createHarnessSubtask
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [memberID, goal]
              properties:
                memberID: {type: string, minLength: 1, maxLength: 160}
                goal: {type: string, minLength: 1, maxLength: 200000}
      responses:
        '200':
          description: Updated durable Turn with the manually spawned subtask
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/subtasks/{subtaskID}/cancel:
    post:
      operationId: cancelHarnessSubtask
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - name: subtaskID
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Updated durable Turn with authoritative subtask and budget projections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /harness/turns/{turnID}/subtasks/{subtaskID}/approval:
    post:
      operationId: resolveHarnessSubtaskApproval
      parameters:
        - $ref: '#/components/parameters/HarnessTurnID'
        - name: subtaskID
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkpointID, decision]
              properties:
                checkpointID: {type: string, minLength: 1}
                decision: {type: string, enum: [approve, reject]}
                comment: {type: string}
      responses:
        '200':
          description: Updated durable Turn with authoritative subtask and budget projections
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HarnessTurnSnapshot'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInteractionID:
      name: interactionID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessInvocationID:
      name: invocationID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    HarnessTurnID:
      name: turnID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    AfterSeq:
      name: afterSeq
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    EventPageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    HarnessItemPageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RequestBodyTooLarge:
      description: HTTP 413. Strict JSON body exceeds 8 MiB (8388608 bytes); error code request.body_too_large.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RunFeedCursorExpired:
      description: Error code `runfeed.cursor_expired`. Restore the durable Run snapshot before continuing from the returned high-water mark.
      headers:
        X-Run-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    HarnessFeedCursorExpired:
      description: Error code `harness.feed_cursor_expired`. Restore the durable Harness Turn snapshot before continuing from the returned high-water mark.
      headers:
        X-Harness-Feed-Head:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      required: [tenantID, actorID]
      properties:
        tenantID: {type: string}
        actorID: {type: string}
    ThreadRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    HostRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    ThreadRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, minLength: 1, maxLength: 64}
        id: {type: string, minLength: 1, maxLength: 128}
    TextInputRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 200000}
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    ResolveHarnessApprovalRequest:
      type: object
      additionalProperties: false
      required: [checkpointID, decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string}
        checkpointID:
          type: string
          minLength: 1
          maxLength: 128
          description: Exact displayed approval checkpoint; stale or mismatched IDs are rejected.
    GrantHarnessCallAllowanceRequest:
      type: object
      additionalProperties: false
      required: [expectedTurnRevision]
      anyOf:
        - required: [modelCalls]
          properties: {modelCalls: {type: integer, minimum: 1}}
        - required: [toolCalls]
          properties: {toolCalls: {type: integer, minimum: 1}}
      properties:
        expectedTurnRevision: {type: integer, minimum: 1}
        modelCalls: {type: integer, minimum: 0}
        toolCalls: {type: integer, minimum: 0}
    ResolveHarnessInteractionRequest:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: {}
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
    Run:
      type: object
      additionalProperties: false
      required: [id, kind, actor, thread, goal, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        kind:
          type: string
          description: Feature-owned Run kind. Built-ins include agent and a2a.remote; hosts may register additional kinds.
        actor: {$ref: '#/components/schemas/ActorRef'}
        thread: {$ref: '#/components/schemas/ThreadRef'}
        requestID: {type: string}
        goal: {type: string}
        status: {type: string, enum: [running, waiting_input, paused_budget, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [seq, type, createdAt]
      properties:
        seq: {type: integer}
        type: {type: string}
        message: {type: string}
        data: {}
        createdAt: {type: string, format: date-time}
    RunFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, runID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        runID: {type: string}
        type: {type: string}
        delta: {type: string}
        message: {type: string}
        data: {}
        revision: {type: integer, minimum: 1}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessTurn:
      type: object
      additionalProperties: false
      required: [id, hostTurn, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        hostTurn: {$ref: '#/components/schemas/HostRef'}
        status: {type: string, enum: [accepted, running, waiting_input, paused_budget, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessItem:
      type: object
      additionalProperties: false
      required: [id, turnID, seq, kind, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        seq: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic, budget, subtask]
        status: {type: string, enum: [started, waiting, completed, failed, cancelled]}
        hostRef: {$ref: '#/components/schemas/HostRef'}
        invocationID: {type: string}
        parentItemID: {type: string}
        payload: {}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessTurnFeedEvent:
      type: object
      additionalProperties: false
      required: [seq, turnID, type, createdAt]
      properties:
        seq: {type: integer, minimum: 1}
        turnID: {type: string}
        type:
          type: string
          enum: [turn.started, turn.waiting_input, turn.paused_budget, turn.completed, turn.failed, turn.cancelled, item.started, item.delta, item.completed]
        itemID: {type: string}
        itemKind:
          type: string
          enum: [user_message, agent_run, agent_message, tool, approval, delegation, capability_invocation, interaction, artifact, context, diagnostic, budget, subtask]
        delta: {type: string}
        message: {type: string}
        data: {}
        status: {type: string}
        terminal: {type: boolean}
        createdAt: {type: string, format: date-time}
    HarnessCapabilityInvocation:
      type: object
      additionalProperties: false
      required: [id, turnID, capabilityKey, executionClass, status, attempt, outputRefs, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        parentItemID: {type: string}
        capabilityKey: {type: string}
        definitionVersion: {type: string}
        executionClass: {type: string, enum: [agent, application]}
        inputHash: {type: string}
        status: {type: string, enum: [accepted, running, waiting_input, paused_budget, completed, failed, cancelled]}
        attempt: {type: integer, minimum: 1}
        outputRefs:
          type: array
          items: {$ref: '#/components/schemas/HostRef'}
        errorCode: {type: string}
        errorDetail: {type: string}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessInteraction:
      type: object
      additionalProperties: false
      required: [id, turnID, invocationID, key, kind, schema, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        turnID: {type: string}
        invocationID: {type: string}
        parentItemID: {type: string}
        key: {type: string}
        kind: {type: string, enum: [choice, confirmation, input]}
        schema: {}
        presentation: {}
        status: {type: string, enum: [waiting, resolved]}
        response: {}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    HarnessTurnState:
      type: object
      additionalProperties: false
      required: [turn]
      properties:
        turn: {$ref: '#/components/schemas/HarnessTurn'}
    HarnessTimelinePage:
      type: object
      additionalProperties: false
      required: [items, nextAfterSeq]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/HarnessItem'}
        nextAfterSeq: {type: integer, minimum: 0}
    HarnessTurnSnapshot:
      type: object
      additionalProperties: false
      required: [turn, invocations, interactions, items]
      properties:
        turn: {$ref: '#/components/schemas/HarnessTurn'}
        invocations:
          type: array
          items: {$ref: '#/components/schemas/HarnessCapabilityInvocation'}
        interactions:
          type: array
          items: {$ref: '#/components/schemas/HarnessInteraction'}
        items:
          type: array
          items: {$ref: '#/components/schemas/HarnessItem'}
        budget: {$ref: '#/components/schemas/HarnessBudget'}
        subtasks:
          type: array
          items: {$ref: '#/components/schemas/HarnessSubtask'}
        output: {$ref: '#/components/schemas/Result'}
    RuntimeBudgetLimits:
      type: object
      additionalProperties: false
      properties:
        maxLLMCalls: {type: integer, minimum: 0}
        maxToolCalls: {type: integer, minimum: 0}
        maxInputTokens: {type: integer, minimum: 0}
        maxOutputTokens: {type: integer, minimum: 0}
        maxTotalTokens: {type: integer, minimum: 0}
        maxChildRuns: {type: integer, minimum: 0}
        maxConcurrentRuns: {type: integer, minimum: 0}
        maxOutputBytes: {type: integer, minimum: 0}
        maxStateBytes: {type: integer, minimum: 0}
        maxCostUnits: {type: integer, minimum: 0}
    RuntimeBudgetUsage:
      type: object
      additionalProperties: false
      properties:
        llmCalls: {type: integer, minimum: 0}
        toolCalls: {type: integer, minimum: 0}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        totalTokens: {type: integer, minimum: 0}
        cacheReadTokens: {type: integer, minimum: 0}
        cacheWriteTokens: {type: integer, minimum: 0}
        reasoningTokens: {type: integer, minimum: 0}
        childRuns: {type: integer, minimum: 0}
        outputBytes: {type: integer, minimum: 0}
        stateBytes: {type: integer, minimum: 0}
        costUnits: {type: integer, minimum: 0}
    HarnessBudget:
      type: object
      additionalProperties: false
      required: [scopeID, revision, limits, usage, reserved, remaining, activeRuns, waitingRuns]
      properties:
        scopeID: {type: string}
        revision: {type: integer, minimum: 1}
        limits: {$ref: '#/components/schemas/RuntimeBudgetLimits'}
        usage: {$ref: '#/components/schemas/RuntimeBudgetUsage'}
        reserved: {$ref: '#/components/schemas/RuntimeBudgetUsage'}
        remaining: {$ref: '#/components/schemas/RuntimeBudgetUsage'}
        activeRuns: {type: integer, minimum: 0}
        waitingRuns: {type: integer, minimum: 0}
        unknownUsage: {type: boolean}
        cancelled: {type: boolean}
    HarnessSubtask:
      type: object
      additionalProperties: false
      required: [id, kind, goal, status, usageKnown]
      properties:
        id: {type: string}
        runID: {type: string}
        parentID: {type: string}
        kind: {type: string}
        memberID: {type: string}
        memberRevision: {type: string}
        goal: {type: string}
        model: {type: string}
        status: {type: string, enum: [queued, created, running, waiting, waiting_input, waiting_budget, paused, completed, failed, cancelled]}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/HarnessBudget'}
        usageKnown: {type: boolean}
        result: {}
        errorCode: {type: string}
        errorDetail: {type: string}
        cancelStatus: {type: string, enum: [requested, failed, confirmed]}
        cancelError: {type: string}
        cancelAttempt: {type: integer, minimum: 1}
        approval:
          type: object
          required: [checkpointID, toolCallID, toolKey, toolName, arguments]
          properties:
            checkpointID: {type: string}
            toolCallID: {type: string}
            toolKey: {type: string}
            toolName: {type: string}
            arguments: {}
    Checkpoint:
      type: object
      additionalProperties: false
      required: [id, kind, status, payload, createdAt]
      properties:
        id: {type: string}
        kind: {type: string}
        status: {type: string, enum: [pending, resolved]}
        payload: {description: 'Public Run snapshots always return null; original opaque checkpoint content and response remain in Kernel.'}
        createdAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
    Result:
      type: object
      additionalProperties: false
      required: [contentType, content]
      properties:
        contentType: {type: string}
        content: {}
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [run, state, eventHead]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        state: {}
        checkpoint: {$ref: '#/components/schemas/Checkpoint'}
        result: {$ref: '#/components/schemas/Result'}
        eventHead:
          type: integer
          format: int64
          minimum: 0
        pendingTool: {$ref: '#/components/schemas/PendingTool'}
    PendingTool:
      type: object
      additionalProperties: false
      required: [kind, callID, toolKey, ready]
      properties:
        kind: {type: string, enum: [external_result, child_terminal]}
        callID: {type: string}
        toolKey: {type: string}
        deadlineAt: {type: string, format: date-time}
        ready: {type: boolean}
    RunEventPage:
      type: object
      additionalProperties: false
      required: [events, eventHead]
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/Event'}
        eventHead:
          type: integer
          format: int64
          minimum: 0
    CancelRunResponse:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: '#/components/schemas/Run'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
