openapi: 3.0.3
info:
  title: Agent Runtime API
  version: 1.0.0
paths:
  /agent-runs:
    post:
      operationId: createAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartAgentRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs:
    post:
      operationId: createPlanRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartPlanRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /plan-runs/{runID}/approval:
    post:
      operationId: resolvePlanApproval
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolvePlanApprovalRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs:
    post:
      operationId: createWorkflowRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartWorkflowRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /workflow-runs/{runID}/wait:
    post:
      operationId: resolveWorkflowWait
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveWorkflowWaitRequest'}
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /team-runs:
    post:
      operationId: createTeamRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartTeamRunRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Run snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRunRequest'}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelRunResponse'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{runID}/workbench:
    get:
      operationId: getWorkbench
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: Workbench detail
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    RunID:
      name: runID
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ActorRef:
      type: object
      additionalProperties: false
      required: [tenantID, actorID]
      properties:
        tenantID: {type: string}
        actorID: {type: string}
    ThreadRef:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    ThreadRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, maxLength: 64}
        id: {type: string, maxLength: 128}
    TextInputRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, maxLength: 200000}
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
    StartPlanRunRequest:
      type: object
      additionalProperties: false
      required: [thread, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        input: {$ref: '#/components/schemas/TextInputRequest'}
        clientRunID: {type: string, maxLength: 64}
        model: {type: string, maxLength: 128}
        approvalPolicy: {type: string, enum: [auto, required]}
        maxSteps: {type: integer, minimum: 1, maximum: 32}
    ResolvePlanApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, decision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, maxLength: 2000}
    StartWorkflowRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, definition, input]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        definition: {type: object, additionalProperties: true}
        input: {}
    ResolveWorkflowWaitRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, response]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        response: {}
    TeamMemberRequest:
      type: object
      additionalProperties: false
      required: [id, goal]
      properties:
        id: {type: string, maxLength: 128}
        goal: {type: string, maxLength: 200000}
        toolKeys:
          type: array
          maxItems: 128
          items: {type: string, maxLength: 255}
    TeamJoinRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [all, any, quorum]}
        quorum: {type: integer, minimum: 1, maximum: 16}
        failurePolicy: {type: string, enum: [collect, fail_fast]}
    StartTeamRunRequest:
      type: object
      additionalProperties: false
      required: [thread, goal, mode, members, join]
      properties:
        thread: {$ref: '#/components/schemas/ThreadRequest'}
        goal: {type: string, maxLength: 200000}
        clientRunID: {type: string, maxLength: 64}
        mode: {type: string, enum: [sequential, parallel]}
        members:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/TeamMemberRequest'}
        join: {$ref: '#/components/schemas/TeamJoinRequest'}
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: {type: integer, minimum: 1}
        reason: {type: string, maxLength: 2000}
    Run:
      type: object
      additionalProperties: false
      required: [id, kind, actor, thread, goal, status, revision, createdAt, updatedAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [text, plan_execute, workflow, team]}
        actor: {$ref: '#/components/schemas/ActorRef'}
        thread: {$ref: '#/components/schemas/ThreadRef'}
        requestID: {type: string}
        goal: {type: string}
        status: {type: string, enum: [running, waiting_input, completed, failed, cancelled]}
        revision: {type: integer, minimum: 1}
        errorCode: {type: string}
        errorDetail: {type: string}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      required: [seq, type, createdAt]
      properties:
        seq: {type: integer}
        type: {type: string}
        message: {type: string}
        data: {}
        createdAt: {type: string, format: date-time}
    Checkpoint:
      type: object
      additionalProperties: true
    Result:
      type: object
      additionalProperties: true
    RunSnapshot:
      type: object
      additionalProperties: false
      required: [run, state, events]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        state: {}
        checkpoint: {$ref: '#/components/schemas/Checkpoint'}
        result: {$ref: '#/components/schemas/Result'}
        events:
          type: array
          items: {$ref: '#/components/schemas/Event'}
    CancelRunResponse:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: '#/components/schemas/Run'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestID]
          properties:
            code: {type: string}
            message: {type: string}
            requestID: {type: string}
