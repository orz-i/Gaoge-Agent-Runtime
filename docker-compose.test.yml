services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime
      POSTGRES_DB: agent_runtime
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime -d agent_runtime"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.149.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./integration/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "54318:4318"
