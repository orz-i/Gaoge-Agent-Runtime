services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime
      POSTGRES_DB: agent_runtime
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime -d agent_runtime"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
